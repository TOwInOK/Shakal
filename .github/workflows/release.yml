name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release archive
        run: zip convert-context-menu.zip install.bat uninstall.bat commands.reg README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: convert-context-menu.zip
          generate_release_notes: true
